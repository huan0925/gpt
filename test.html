<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晶片封裝資訊表</title>
    <style>
        table {
            border-collapse: collapse;
            width: 90%;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #000;
            text-align: center;
            padding: 10px;
        }
        th {
            background-color: #f0f8ff;
        }
        td {
            background-color: #fafafa;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th rowspan="3">晶片系列</th>
            <th rowspan="3">型號</th>
            <th colspan="7">封裝資訊</th>
            <th rowspan="3">應用領域</th>
        </tr>
        <tr>
            <th rowspan="2">封裝類型</th>
            <th colspan="2">尺寸 (mm)</th>
            <th rowspan="2">引腳數</th>
            <th colspan="3">材料與特性</th>
        </tr>
        <tr>
            <th>長</th>
            <th>寬</th>
            <th>材質</th>
            <th>散熱特性</th>
            <th>防護等級</th>
        </tr>
        <tr>
            <td rowspan="2">Alpha系列</td>
            <td>XC1234</td>
            <td>BGA</td>
            <td>10.0</td>
            <td>10.0</td>
            <td>144</td>
            <td>塑膠</td>
            <td>高效</td>
            <td>IP54</td>
            <td>消費電子</td>
        </tr>
        <tr>
            <td>XC5678</td>
            <td>QFP</td>
            <td>12.0</td>
            <td>12.0</td>
            <td>196</td>
            <td>陶瓷</td>
            <td>中效</td>
            <td>IP67</td>
            <td>工業自動化</td>
        </tr>
        <tr>
            <td rowspan="2">Beta系列</td>
            <td>XR9101</td>
            <td>WLCSP</td>
            <td>6.0</td>
            <td>6.0</td>
            <td>72</td>
            <td>矽</td>
            <td>低效</td>
            <td>IP44</td>
            <td>行動設備</td>
        </tr>
        <tr>
            <td>XR3456</td>
            <td>BGA</td>
            <td>8.0</td>
            <td>8.0</td>
            <td>100</td>
            <td>塑膠</td>
            <td>高效</td>
            <td>IP55</td>
            <td>醫療設備</td>
        </tr>
    </table>
</body>
</html>
